
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.app { display: flex; height: 580px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; background: var(--color-background-primary); }
.sidebar { width: 220px; border-right: 0.5px solid var(--color-border-tertiary); display: flex; flex-direction: column; background: var(--color-background-secondary); flex-shrink: 0; }
.sidebar-header { padding: 16px 14px 10px; border-bottom: 0.5px solid var(--color-border-tertiary); }
.sidebar-header h2 { font-size: 15px; font-weight: 500; color: var(--color-text-primary); display: flex; align-items: center; gap: 8px; }
.sidebar-header h2 i { font-size: 18px; color: var(--color-text-secondary); }
.sidebar-search { padding: 10px 10px 6px; }
.sidebar-search input { width: 100%; font-size: 13px; padding: 6px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); }
.sidebar-section { padding: 6px 10px 2px; font-size: 11px; font-weight: 500; color: var(--color-text-tertiary); letter-spacing: 0.04em; text-transform: uppercase; }
.cred-list { flex: 1; overflow-y: auto; padding: 0 6px 8px; }
.cred-item { display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: var(--border-radius-md); cursor: pointer; margin-bottom: 2px; }
.cred-item:hover { background: var(--color-background-primary); }
.cred-item.active { background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); }
.cred-icon { width: 32px; height: 32px; border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.cred-icon.ssh      { background: #E1F5EE; color: #0F6E56; }
.cred-icon.pat      { background: #E6F1FB; color: #185FA5; }
.cred-icon.userpass { background: #FAEEDA; color: #854F0B; }
.cred-icon.api      { background: #EEEDFE; color: #534AB7; }
.cred-icon.keypair  { background: #FBEAF0; color: #993556; }
.cred-icon.db       { background: #FAECE7; color: #993C1D; }
.cred-name { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
.cred-type { font-size: 11px; color: var(--color-text-secondary); }
.sidebar-footer { padding: 10px; border-top: 0.5px solid var(--color-border-tertiary); }
.add-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-primary); font-size: 13px; cursor: pointer; }
.add-btn:hover { background: var(--color-background-primary); }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.main-header { padding: 14px 20px 12px; border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; justify-content: space-between; }
.main-title { font-size: 16px; font-weight: 500; color: var(--color-text-primary); display: flex; align-items: center; gap: 8px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
.badge.ssh      { background: #E1F5EE; color: #0F6E56; }
.badge.pat      { background: #E6F1FB; color: #185FA5; }
.badge.userpass { background: #FAEEDA; color: #854F0B; }
.badge.api      { background: #EEEDFE; color: #534AB7; }
.badge.keypair  { background: #FBEAF0; color: #993556; }
.badge.db       { background: #FAECE7; color: #993C1D; }
.header-actions { display: flex; gap: 8px; }
.icon-btn { background: transparent; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 6px 8px; cursor: pointer; color: var(--color-text-secondary); font-size: 15px; display: flex; align-items: center; }
.icon-btn:hover { color: var(--color-text-primary); background: var(--color-background-secondary); }
.icon-btn.danger:hover { color: var(--color-text-danger); border-color: var(--color-border-danger); }
.main-body { flex: 1; overflow-y: auto; padding: 20px; }
.field-group { margin-bottom: 16px; }
.field-label { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 5px; letter-spacing: 0.03em; }
.field-val { display: flex; align-items: center; gap: 8px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 8px 12px; font-size: 13px; color: var(--color-text-primary); font-family: var(--font-mono); min-height: 38px; }
.field-val.masked { letter-spacing: 0.12em; color: var(--color-text-tertiary); }
.field-val-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copy-btn { background: transparent; border: none; cursor: pointer; color: var(--color-text-secondary); padding: 2px; font-size: 15px; display: flex; align-items: center; flex-shrink: 0; }
.copy-btn:hover { color: var(--color-text-primary); }
.reveal-btn { background: transparent; border: none; cursor: pointer; color: var(--color-text-secondary); padding: 2px; font-size: 15px; display: flex; align-items: center; }
.reveal-btn:hover { color: var(--color-text-primary); }
.section-divider { font-size: 11px; font-weight: 500; color: var(--color-text-tertiary); letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 0.5px solid var(--color-border-tertiary); padding-bottom: 6px; margin-bottom: 14px; margin-top: 8px; }
.meta-row { display: flex; gap: 20px; margin-bottom: 16px; }
.meta-item { flex: 1; }
.notes-box { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 10px 12px; font-size: 13px; color: var(--color-text-primary); line-height: 1.6; min-height: 56px; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--color-text-tertiary); gap: 10px; font-size: 14px; }
.empty-state i { font-size: 40px; }
.modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 10; border-radius: var(--border-radius-lg); }
.modal { background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); width: 390px; max-height: 92%; overflow-y: auto; }
.modal-header { padding: 16px 18px 12px; border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; justify-content: space-between; }
.modal-header h3 { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
.modal-body { padding: 16px 18px; }
.modal-footer { padding: 12px 18px 16px; border-top: 0.5px solid var(--color-border-tertiary); display: flex; justify-content: flex-end; gap: 8px; }
.form-field { margin-bottom: 13px; }
.form-label { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 5px; }
.form-field input, .form-field select, .form-field textarea { width: 100%; font-size: 13px; }
.form-field textarea { min-height: 60px; resize: vertical; font-family: var(--font-sans); padding: 8px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); }
.type-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.type-opt { border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 10px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--color-text-secondary); text-align: center; }
.type-opt:hover { background: var(--color-background-secondary); }
.type-opt.selected { border-color: var(--color-border-info); background: var(--color-background-info); color: var(--color-text-info); }
.type-opt i { font-size: 20px; }
.save-btn { background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 7px 16px; font-size: 13px; color: var(--color-text-primary); cursor: pointer; }
.save-btn.primary { background: var(--color-text-primary); color: var(--color-background-primary); border-color: var(--color-text-primary); }
.save-btn:hover { background: var(--color-background-secondary); }
.save-btn.primary:hover { opacity: 0.85; }
.toast { position: absolute; bottom: 16px; right: 16px; background: var(--color-text-primary); color: var(--color-background-primary); padding: 8px 14px; border-radius: var(--border-radius-md); font-size: 13px; display: none; align-items: center; gap: 8px; z-index: 20; }
.toast.show { display: flex; }
.keypair-highlight { border-left: 2px solid #D4537E; padding-left: 10px; margin-bottom: 16px; }
</style>

<h2 class="sr-only">Credential vault — store SSH, GitHub PAT, username/password, API key, API key + secret pair, and database credentials</h2>

<div class="app" id="app" style="position:relative;">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2><i class="ti ti-lock" aria-hidden="true"></i> Vault</h2>
    </div>
    <div class="sidebar-search">
      <input type="text" placeholder="Search…" id="search-input" oninput="renderList()" />
    </div>
    <div class="cred-list" id="cred-list"></div>
    <div class="sidebar-footer">
      <button class="add-btn" onclick="openAddModal()">
        <i class="ti ti-plus" aria-hidden="true"></i> Add credential
      </button>
    </div>
  </div>
  <div class="main">
    <div id="detail-area" style="flex:1;display:flex;flex-direction:column;"></div>
  </div>
  <div class="toast" id="toast"><i class="ti ti-check" aria-hidden="true"></i> <span id="toast-msg">Copied!</span></div>
  <div id="modal-container"></div>
</div>

<script>
const TYPES = {
  ssh:      { label: 'SSH',              icon: 'ti-terminal-2',    fields: ['host','port','username','private_key','passphrase'] },
  pat:      { label: 'GitHub PAT',       icon: 'ti-brand-github',  fields: ['name','token','scopes','expiry'] },
  userpass: { label: 'Username/Pass',    icon: 'ti-user',           fields: ['url','username','password'] },
  api:      { label: 'API key',          icon: 'ti-api',            fields: ['service','api_key','endpoint'] },
  keypair:  { label: 'Key + Secret',     icon: 'ti-key',            fields: ['service','key_id','secret_key','region','endpoint'] },
  db:       { label: 'Database',         icon: 'ti-database',       fields: ['host','port','database','username','password'] },
};

const FIELD_META = {
  host:        { label: 'Host',         secret: false },
  port:        { label: 'Port',         secret: false },
  username:    { label: 'Username',     secret: false },
  private_key: { label: 'Private key',  secret: true  },
  passphrase:  { label: 'Passphrase',   secret: true  },
  name:        { label: 'Name',         secret: false },
  token:       { label: 'Token',        secret: true  },
  scopes:      { label: 'Scopes',       secret: false },
  expiry:      { label: 'Expiry',       secret: false },
  url:         { label: 'URL',          secret: false },
  password:    { label: 'Password',     secret: true  },
  service:     { label: 'Service',      secret: false },
  api_key:     { label: 'API key',      secret: true  },
  endpoint:    { label: 'Endpoint',     secret: false },
  database:    { label: 'Database',     secret: false },
  key_id:      { label: 'Access key ID / Client ID',   secret: false },
  secret_key:  { label: 'Secret key / Client secret',  secret: true  },
  region:      { label: 'Region',       secret: false },
};

let creds = [
  { id:1, type:'ssh',      label:'prod-server-01',  host:'prod-server-01.example.com', port:'22',    username:'deploy',             private_key:'-----BEGIN OPENSSH PRIVATE KEY-----\nb3BlbnNzaC1rZXktdjEAAAA...', passphrase:'hunter2',                notes:'Production deploy user', created:'2025-11-14' },
  { id:2, type:'pat',      label:'GitHub CI/CD',    name:'CI/CD pipeline',             token:'ghp_xKmQ8L9aVzPr3nTdW0bYcFjE1iHuNoG7s', scopes:'repo, workflow, read:org', expiry:'2026-12-31',              notes:'Used by GitHub Actions',  created:'2025-12-01' },
  { id:3, type:'userpass', label:'Jira',            url:'https://jira.example.com',    username:'alice@example.com',          password:'S3cur3P@ssw0rd!',          notes:'',                       created:'2025-10-22' },
  { id:4, type:'api',      label:'Stripe API',      service:'Stripe',                  api_key:'sk_live_51OxZQwRtN8PmA3bVlDkF9cHsYe2GjTuX0qWrI', endpoint:'https://api.stripe.com/v1',  notes:'Live key — handle with care', created:'2026-01-05' },
  { id:5, type:'keypair',  label:'AWS production',  service:'AWS',                     key_id:'AKIAIOSFODNN7EXAMPLE',         secret_key:'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY', region:'ap-southeast-1', endpoint:'', notes:'IAM user for S3 + EC2', created:'2026-03-10' },
  { id:6, type:'keypair',  label:'Twilio',          service:'Twilio',                  key_id:'ACa1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4', secret_key:'abc123def456abc123def456abc123de', region:'',  endpoint:'https://api.twilio.com', notes:'SMS service account', created:'2026-04-02' },
  { id:7, type:'db',       label:'Postgres prod',   host:'db.internal',                port:'5432',  database:'app_production',     username:'app_user',              password:'pg_pass_secure!',      notes:'PostgreSQL prod DB',     created:'2026-02-18' },
];
let nextId = 8;
let selected = 1;
let revealed = {};
let addStep = 1;
let addType = 'ssh';

function getLabel(c) { return c.label || c.host || c.name || c.service || c.url || 'Unnamed'; }

function renderList() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const el = document.getElementById('cred-list');
  const sections = {};
  creds.filter(c => !q || JSON.stringify(c).toLowerCase().includes(q)).forEach(c => {
    if (!sections[c.type]) sections[c.type] = [];
    sections[c.type].push(c);
  });
  let html = '';
  Object.entries(TYPES).forEach(([t, meta]) => {
    if (!sections[t]) return;
    html += `<div class="sidebar-section">${meta.label}</div>`;
    sections[t].forEach(c => {
      const sub = c.type==='userpass' ? (c.username||'') : c.type==='keypair' ? (c.service||'') : (c.host||c.service||'');
      html += `<div class="cred-item${c.id===selected?' active':''}" onclick="selectCred(${c.id})">
        <div class="cred-icon ${t}"><i class="ti ${meta.icon}" aria-hidden="true"></i></div>
        <div><div class="cred-name">${esc(getLabel(c))}</div><div class="cred-type">${esc(sub)}</div></div>
      </div>`;
    });
  });
  el.innerHTML = html || '<div style="padding:16px;font-size:13px;color:var(--color-text-tertiary);">No results</div>';
}

function selectCred(id) { selected = id; revealed = {}; renderList(); renderDetail(); }

function renderDetail() {
  const area = document.getElementById('detail-area');
  const c = creds.find(x => x.id === selected);
  if (!c) { area.innerHTML = `<div class="empty-state"><i class="ti ti-lock-open" aria-hidden="true"></i><span>Select a credential</span></div>`; return; }
  const meta = TYPES[c.type];
  let fieldsHtml = '';

  meta.fields.forEach(f => {
    const fm = FIELD_META[f];
    const val = c[f] || '';
    const isSecret = fm.secret;
    const isRevealed = revealed[f];
    const display = isSecret && !isRevealed ? '••••••••••••' : esc(val);
    const cls = isSecret && !isRevealed ? 'masked' : '';
    const revBtn = isSecret ? `<button class="reveal-btn" onclick="toggleReveal('${f}')" title="${isRevealed?'Hide':'Reveal'}"><i class="ti ${isRevealed?'ti-eye-off':'ti-eye'}" aria-hidden="true"></i></button>` : '';
    const wrapClass = (c.type==='keypair' && (f==='key_id'||f==='secret_key')) ? ' keypair-highlight' : '';
    fieldsHtml += `<div class="field-group${wrapClass}">
      <div class="field-label">${fm.label}</div>
      <div class="field-val ${cls}">
        <span class="field-val-text">${display}</span>
        ${revBtn}
        <button class="copy-btn" onclick="copyVal('${escA(val)}','${fm.label}')" title="Copy"><i class="ti ti-copy" aria-hidden="true"></i></button>
      </div>
    </div>`;
  });

  const notesHtml = c.notes ? `<div class="section-divider">Notes</div><div class="notes-box">${esc(c.notes)}</div>` : '';

  area.innerHTML = `
    <div class="main-header">
      <div class="main-title">
        <div class="cred-icon ${c.type}" style="width:28px;height:28px;font-size:14px;"><i class="ti ${meta.icon}" aria-hidden="true"></i></div>
        ${esc(getLabel(c))}
        <span class="badge ${c.type}">${meta.label}</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openEdit(${c.id})" title="Edit"><i class="ti ti-edit" aria-hidden="true"></i></button>
        <button class="icon-btn danger" onclick="deleteCred(${c.id})" title="Delete"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="main-body">
      <div class="section-divider">Credentials</div>
      ${fieldsHtml}
      ${notesHtml}
      <div style="margin-top:16px;">
        <div class="section-divider">Info</div>
        <div class="meta-row">
          <div class="meta-item"><div class="field-label">Added</div><div style="font-size:13px;color:var(--color-text-primary);">${c.created||'—'}</div></div>
          <div class="meta-item"><div class="field-label">Type</div><div style="font-size:13px;color:var(--color-text-primary);">${meta.label}</div></div>
        </div>
      </div>
    </div>`;
}

function toggleReveal(f) { revealed[f] = !revealed[f]; renderDetail(); }

function copyVal(val, label) {
  try { navigator.clipboard.writeText(val); } catch(e) {}
  showToast(`${label} copied`);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function deleteCred(id) {
  creds = creds.filter(c => c.id !== id);
  selected = creds[0]?.id || null;
  renderList(); renderDetail();
}

function openAddModal() { addStep = 1; addType = 'ssh'; renderModal(); }

function renderModal(editing=null) {
  const mc = document.getElementById('modal-container');
  if (editing) {
    const c = creds.find(x => x.id === editing);
    const meta = TYPES[c.type];
    let ff = `<div class="form-field"><div class="form-label">Label</div><input id="ef-label" value="${escA(c.label||getLabel(c))}" /></div>`;
    meta.fields.forEach(f => {
      const fm = FIELD_META[f];
      ff += `<div class="form-field"><div class="form-label">${fm.label}</div><input id="ef-${f}" value="${escA(c[f]||'')}" type="${fm.secret?'password':'text'}" placeholder="${fm.label}" /></div>`;
    });
    ff += `<div class="form-field"><div class="form-label">Notes</div><textarea id="ef-notes">${esc(c.notes||'')}</textarea></div>`;
    mc.innerHTML = `<div class="modal-overlay"><div class="modal">
      <div class="modal-header"><h3>Edit credential</h3><button class="icon-btn" onclick="closeModal()"><i class="ti ti-x" aria-hidden="true"></i></button></div>
      <div class="modal-body">${ff}</div>
      <div class="modal-footer"><button class="save-btn" onclick="closeModal()">Cancel</button><button class="save-btn primary" onclick="saveEdit(${editing})">Save changes</button></div>
    </div></div>`;
    return;
  }
  if (addStep === 1) {
    const opts = Object.entries(TYPES).map(([t,m]) =>
      `<div class="type-opt${addType===t?' selected':''}" onclick="pickType('${t}')"><i class="ti ${m.icon}" aria-hidden="true"></i>${m.label}</div>`).join('');
    mc.innerHTML = `<div class="modal-overlay"><div class="modal">
      <div class="modal-header"><h3>Add credential</h3><button class="icon-btn" onclick="closeModal()"><i class="ti ti-x" aria-hidden="true"></i></button></div>
      <div class="modal-body"><div class="form-label" style="margin-bottom:8px;">Select type</div><div class="type-grid">${opts}</div></div>
      <div class="modal-footer"><button class="save-btn" onclick="closeModal()">Cancel</button><button class="save-btn primary" onclick="goStep2()">Next →</button></div>
    </div></div>`;
  } else {
    const meta = TYPES[addType];
    let ff = `<div class="form-field"><div class="form-label">Label</div><input id="nf-label" placeholder="e.g. AWS production" /></div>`;
    if (addType === 'keypair') {
      ff += `<div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;margin-bottom:13px;font-size:12px;color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary);">Works for AWS, GCP, Twilio, SendGrid, Cloudflare, and any service that gives you a key ID + secret pair.</div>`;
    }
    meta.fields.forEach(f => {
      const fm = FIELD_META[f];
      ff += `<div class="form-field"><div class="form-label">${fm.label}</div><input id="nf-${f}" type="${fm.secret?'password':'text'}" placeholder="${fm.label}" /></div>`;
    });
    ff += `<div class="form-field"><div class="form-label">Notes</div><textarea id="nf-notes" placeholder="Optional notes…"></textarea></div>`;
    mc.innerHTML = `<div class="modal-overlay"><div class="modal">
      <div class="modal-header"><h3><span style="color:var(--color-text-secondary);cursor:pointer;" onclick="addStep=1;renderModal()">← </span>${meta.label}</h3><button class="icon-btn" onclick="closeModal()"><i class="ti ti-x" aria-hidden="true"></i></button></div>
      <div class="modal-body">${ff}</div>
      <div class="modal-footer"><button class="save-btn" onclick="closeModal()">Cancel</button><button class="save-btn primary" onclick="saveNew()">Save</button></div>
    </div></div>`;
  }
}

function pickType(t) { addType = t; renderModal(); }
function goStep2() { addStep = 2; renderModal(); }
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

function saveNew() {
  const meta = TYPES[addType];
  const c = { id: nextId++, type: addType, label: document.getElementById('nf-label').value, notes: document.getElementById('nf-notes').value, created: new Date().toISOString().slice(0,10) };
  meta.fields.forEach(f => { c[f] = document.getElementById('nf-'+f)?.value || ''; });
  if (!c.label) c.label = c[meta.fields[0]] || 'New credential';
  creds.push(c);
  selected = c.id;
  closeModal(); renderList(); renderDetail();
  showToast('Credential saved');
}

function openEdit(id) { renderModal(id); }

function saveEdit(id) {
  const c = creds.find(x => x.id === id);
  const meta = TYPES[c.type];
  c.label = document.getElementById('ef-label').value || c.label;
  c.notes = document.getElementById('ef-notes').value;
  meta.fields.forEach(f => { const el = document.getElementById('ef-'+f); if(el) c[f] = el.value; });
  closeModal(); revealed = {}; renderList(); renderDetail();
  showToast('Changes saved');
}

function esc(s)  { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
